# This repository's own docs site, built by its own shared workflow.
name: docs-site
# Manual until GitHub Pages is enabled on this repository (Settings → Pages → Source: GitHub
# Actions). Then add `push: branches: [main]`.
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: docs-site
  cancel-in-progress: true
jobs:
  docs:
    uses: ./.github/workflows/docs-site.yml
    with:
      publish: pages
